[pytest]
testpaths = tests
# Starlette 1.3 deprecates httpx for its TestClient in favour of httpx2 (raised
# as StarletteDeprecationWarning, a UserWarning subclass). Only the
# test client is affected, httpx stays installed for openai and edgartools, and
# switching would add a test-only dependency to the frozen requirements.
# Revisit when Starlette is next upgraded. Hides this one warning only.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
